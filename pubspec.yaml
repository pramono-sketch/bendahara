name: bendahara
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  intl: ^0.20.2

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.4.0
  fl_chart: ^0.68.0
  image_picker: ^1.0.4
  shared_preferences: ^2.2.0
  google_generative_ai: ^0.4.7
  path_provider: ^2.1.0
  audioplayers: ^5.2.0
  url_launcher: ^6.3.1
  awesome_dialog: 3.2.1
  share_plus: ^7.0.2
  file_picker: ^8.0.7
  excel: ^2.0.0




dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/sound/